services:
  # Public entry: forwards to KrakenD and adds Retry-After only on HTTP 429.
  gateway-entry:
    image: nginx:1.27-alpine
    container_name: supermart-gateway-entry
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - supermart-net

  # ==========================================
  # 1. API GATEWAY (Pintu Masuk Publik)
  # ==========================================
  api-gateway:
    image: devopsfaith/krakend:2.6.3
    container_name: supermart-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./gateway/krakend.json:/etc/krakend/krakend.json:ro
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - supermart-net

  # ==========================================
  # 2. INTERNAL MICROSERVICES (Expose Only)
  # ==========================================
  catalog-service:
    build:
      context: ./services
      dockerfile: catalog/Dockerfile
    container_name: supermart-catalog
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nusantara_db
      MYSQL_USER: nusantara_user
      MYSQL_PASSWORD: nusantara_secret
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - supermart-net

  order-service:
    build:
      context: ./services
      dockerfile: order/Dockerfile
    container_name: supermart-order
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nusantara_db
      MYSQL_USER: nusantara_user
      MYSQL_PASSWORD: nusantara_secret
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - supermart-net

  # ==========================================
  # 3. NUSANTARA BACKEND & DATABASE
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nusantara-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nusantara_db
      MYSQL_USER: nusantara_user
      MYSQL_PASSWORD: nusantara_secret
      APP_PORT: 3000
      APP_ENV: production
      JWT_SECRET: supermart-secret-key-for-nusantara-course-2026
      JWT_EXPIRY: 24h
      CORS_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - supermart-net

  mysql:
    image: mysql:8.0
    container_name: nusantara-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: nusantara_db
      MYSQL_USER: nusantara_user
      MYSQL_PASSWORD: nusantara_secret
    # Port 3306 internal (opsional: ganti expose jika DB tidak perlu diakses langsung via DBeaver/Navicat host)
    expose:
      - "3306"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./deployment/gateway/03-demo-fixture.sql:/docker-entrypoint-initdb.d/03-demo-fixture.sql:ro
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - supermart-net

  # ==========================================
  # 4. FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nusantara-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - gateway-entry
    networks:
      - supermart-net

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
networks:
  supermart-net:
    driver: bridge

volumes:
  mysql_data:
name: medcore
services:
  patient-db:
    image: postgres:16-alpine
    container_name: medcore-patient-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PATIENT_DB_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASS:?}
      POSTGRES_DB: ${PATIENT_DB_NAME:?}
    ports: ["127.0.0.1:${HOST_PORT_PATIENT_DB:-5433}:5432"]
    volumes:
      - patient_db_vol:/var/lib/postgresql/data
      - type: bind
        source: ./services/patient-service/ddl/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      medcore-net: {ipv4_address: 172.28.0.11}
  appointment-db:
    image: postgres:16-alpine
    container_name: medcore-appointment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APPOINTMENT_DB_USER:?}
      POSTGRES_PASSWORD: ${APPOINTMENT_DB_PASS:?}
      POSTGRES_DB: ${APPOINTMENT_DB_NAME:?}
    ports: ["127.0.0.1:${HOST_PORT_APPOINTMENT_DB:-5434}:5432"]
    volumes:
      - appointment_db_vol:/var/lib/postgresql/data
      - type: bind
        source: ./services/appointment-service/ddl/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      medcore-net: {ipv4_address: 172.28.0.12}
  pharmacy-db:
    image: mongo:7.0-jammy
    container_name: medcore-pharmacy-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?}
      MONGO_INITDB_DATABASE: ${PHARMACY_DB_NAME:?}
      PHARMACY_DB_USER: ${PHARMACY_DB_USER:?}
      PHARMACY_DB_PASS: ${PHARMACY_DB_PASS:?}
    ports: ["127.0.0.1:${HOST_PORT_PHARMACY_DB:-27018}:27017"]
    volumes:
      - pharmacy_db_vol:/data/db
      - type: bind
        source: ./services/pharmacy-service/ddl/init.js
        target: /docker-entrypoint-initdb.d/init.js
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      medcore-net: {ipv4_address: 172.28.0.13}
  billing-db:
    image: mysql:8.0-debian
    container_name: medcore-billing-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BILLING_ROOT_PASS:?}
      MYSQL_DATABASE: ${BILLING_DB_NAME:?}
      MYSQL_USER: ${BILLING_DB_USER:?}
      MYSQL_PASSWORD: ${BILLING_DB_PASS:?}
    ports: ["127.0.0.1:${HOST_PORT_BILLING_DB:-3307}:3306"]
    volumes:
      - billing_db_vol:/var/lib/mysql
      - type: bind
        source: ./services/billing-service/ddl/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      medcore-net: {ipv4_address: 172.28.0.14}
networks:
  medcore-net:
    name: medcore-net
    driver: bridge
    ipam:
      config: [{subnet: 172.28.0.0/16}]
volumes:
  patient_db_vol:
  appointment_db_vol:
  pharmacy_db_vol:
  billing_db_vol:

services:
  billing-worker:
    build: {context: ./services/billing-service}
    restart: unless-stopped
    init: true
    environment:
      BILLING_DB_HOST: billing-db
      BILLING_DB_PORT: "3306"
      BILLING_DB_USER: ${BILLING_DB_USER:?}
      BILLING_DB_PASS: ${BILLING_DB_PASS:?}
      BILLING_DB_NAME: ${BILLING_DB_NAME:?}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: "5672"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:?}
    depends_on:
      billing-db: {condition: service_healthy}
      message-broker: {condition: service_healthy}
    networks: [medcore-net]

# KrakenD performs routing, parallel aggregation and per-client token limiting.
# Only this entry is published. Never trust a client-provided identity header.
map $status $retry_after {
    default "";
    429     "60";
}

server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        set $gateway api-gateway:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Gateway-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # A conservative retry delay: a full refill takes at most one minute.
        add_header Retry-After $retry_after always;
    }
}
